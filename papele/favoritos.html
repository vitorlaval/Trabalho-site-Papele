    <script>
        const produtoSalvo = JSON.parse(localStorage.getItem('produtoFavorito'));

        if (produtoSalvo) {
            document.getElementById('fav-img').src = produtoSalvo.imagem;
            document.getElementById('fav-nome').textContent = produtoSalvo.nome;
            document.getElementById('fav-preco').textContent = produtoSalvo.preco;
        }
